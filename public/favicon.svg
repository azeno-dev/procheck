<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="procheck-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Inner Glow / Shadow Filter -->
    <filter id="procheck-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.35" />
    </filter>

    <linearGradient id="check-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
  </defs>

  <!-- Base Squircle Container -->
  <rect
    x="32"
    y="32"
    width="448"
    height="448"
    rx="112"
    fill="url(#procheck-bg-grad)"
    filter="url(#procheck-shadow)"
  />

  <!-- Subtle Inner Border Highlight -->
  <rect
    x="34"
    y="34"
    width="444"
    height="444"
    rx="110"
    fill="none"
    stroke="#ffffff"
    stroke-width="4"
    stroke-opacity="0.25"
  />

  <!-- Barcode Bars (Stylized) -->
  <g fill="#ffffff" opacity="0.92">
    <!-- Bar 1 (Thin) -->
    <rect x="112" y="148" width="22" height="216" rx="11" />
    <!-- Bar 2 (Wide) -->
    <rect x="156" y="148" width="40" height="216" rx="14" />
    <!-- Bar 3 (Medium) -->
    <rect x="216" y="148" width="28" height="216" rx="14" />
    <!-- Bar 4 (Thin) -->
    <rect x="264" y="148" width="20" height="216" rx="10" />
    <!-- Bar 5 (Wide) -->
    <rect x="304" y="148" width="42" height="216" rx="14" />
    <!-- Bar 6 (Thin) -->
    <rect x="366" y="148" width="26" height="216" rx="13" />
  </g>

  <!-- Superimposed Dynamic Verification Checkmark with Emerald Glow Badge -->
  <circle cx="360" cy="356" r="82" fill="#10b981" />
  <circle cx="360" cy="356" r="76" fill="#059669" />
  
  <!-- White Checkmark Icon -->
  <path
    d="M328 356 L350 378 L394 334"
    fill="none"
    stroke="#ffffff"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
